name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-content-checks:
    name: Repository content checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up maintenance Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install locked maintenance tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check repository content
        run: npm run check

  python-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime package
        run: python -m pip install .
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI help and offline configuration
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        env:
          OOPZ_DEVICE_ID: ci-device
          OOPZ_PERSON_UID: ci-person
          OOPZ_JWT_TOKEN: ci-placeholder
        run: |
          jeppa --help
          jeppa check-config

  repository-checks:
    name: Repository checks
    if: ${{ always() }}
    needs: [repository-content-checks, python-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all repository and Python checks to succeed
        shell: bash
        env:
          CONTENT_RESULT: ${{ needs.repository-content-checks.result }}
          PYTHON_RESULT: ${{ needs.python-tests.result }}
        run: |
          printf 'Repository content checks: %s\nPython matrix: %s\n' "$CONTENT_RESULT" "$PYTHON_RESULT"
          test "$CONTENT_RESULT" = success
          test "$PYTHON_RESULT" = success
