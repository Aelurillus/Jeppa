name: 功能建议
description: 提议文档、工程流程或未来功能，不代表已经获得支持
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        本项目非 Oopz 官方项目。第三方 SDK 的开源许可不等于 Oopz 接入授权。
        请勿提交凭证、账号资料或安全漏洞细节。
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题
      description: 谁遇到了什么问题，现有文档或流程为何不足？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与范围
      description: 区分已有验证和设想；涉及平台接入时附公开的官方接口或授权依据
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收方式
      description: 怎样在不使用真实凭证、不侵犯平台或用户权益的条件下验证？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与参考
      description: 可选；只附可公开的材料
