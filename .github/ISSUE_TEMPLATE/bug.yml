name: 错误报告
description: 报告当前文档、仓库配置或 CI 的可复现错误
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        当前仓库没有机器人实现。请仅报告实际存在内容的问题。
        严禁公开 JWT、token、私钥、Cookie、账号配置和私人日志；安全问题遵循 SECURITY.md。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我已脱敏所有材料，且这不是需要私下报告的安全漏洞。
          required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 操作系统、Node/npm 版本、相关提交或 Actions run 链接（不要包含凭证）
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 使用不包含真实账号或凭证的材料复现
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏输出
    validations:
      required: true
