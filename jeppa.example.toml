# Copy to jeppa.local.toml. Never commit real account material.
[oopz]
method = "credentials"
device_id = ""
person_uid = ""
jwt_token = ""
# Optional private_key is a PEM string. If absent, SDK owns signing-key resolution.
# Or use method = "password_api", phone = "...", password = "...".
# This does not automate CAPTCHA or fall back to a browser.

[bot]
# Explicit area IDs only. Empty means no area subscriptions (private messages only).
areas = []
# Entries are trusted executable Python; paths are relative to launch cwd.
plugins = ["jeppa.plugins.utility:setup", "examples/greet.py:setup"]

[permissions]
# No users/channels key means unrestricted; [] explicitly denies everyone.
# Cooldown is per command + session + user, in seconds; 0 disables it.
cooldown = 2
# channels = ["authorized-internal-channel-id"]

# FAQ writes stay disabled until a nonempty user allowlist is configured.
[permissions.commands.faq-set]
users = []

[permissions.commands.faq-delete]
users = []

[storage]
# Relative paths use the launch directory, as do plugin paths.
path = "data/jeppa.sqlite3"

[logging]
# Only fixed Jeppa status and command outcomes, never raw chat or SDK payloads.
path = "logs/jeppa.log"
max_bytes = 1048576
backups = 3
