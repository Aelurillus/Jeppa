[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jeppa"
version = "0.3.0"
description = "Unofficial Oopz bot base with isolated accounts, transactional plugins and scoped storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aelurillus"}]
dependencies = ["oopz-sdk==0.16.0"]

[project.scripts]
jeppa = "jeppa.cli:main"

[project.urls]
Repository = "https://github.com/Aelurillus/Jeppa"
Homepage = "https://aelurillus.github.io/Jeppa/"

[tool.setuptools.packages.find]
where = ["src"]
